<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyberpunk Neon Snake</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background-color: #080911;
        color: #00ffcc;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 10px;
        color: #ff007f;
        text-shadow: 0 0 15px #ff007f;
      }

      .score-board {
        font-size: 20px;
        margin-bottom: 15px;
        color: #00ffcc;
        text-shadow: 0 0 10px #00ffcc;
      }

      canvas {
        background: #111322;
        border: 3px solid #00ffcc;
        box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
        border-radius: 8px;
      }

      .controls {
        margin-top: 15px;
        color: #888;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>⚡ CYBERNEON SNAKE</h1>
    <div class="score-board">Ochko: <span id="score">0</span></div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
      Boshqaruv: Klaviatuuradagi <b>W, A, S, D</b> yoki
      <b>Strelkalar (⬅️ ⬆️ ➡️ ⬇️)</b>
    </div>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const gridSize = 20;
      const tileCount = canvas.width / gridSize;

      let snake = [{ x: 10, y: 10 }];
      let food = { x: 15, y: 15 };
      let dx = 0;
      let dy = 0;
      let score = 0;

      // Tezlikni boshqarish uchun o'zgaruvchilar
      let initialSpeed = 160; // Boshlang'ich sekin tezlik (milli-soniyada)
      let gameSpeed = initialSpeed;
      let gameTimeout = null;

      document.addEventListener("keydown", changeDirection);

      function gameLoop() {
        moveSnake();
        if (checkGameOver()) {
          alert(`O'yin tugadi! Sizning ochkongiz: ${score}`);
          resetGame();
          return;
        }
        clearCanvas();
        drawFood();
        drawSnake();

        // Keyingi kadrni yangi tezlik bo'yicha rejalashtirish
        gameTimeout = setTimeout(gameLoop, gameSpeed);
      }

      function clearCanvas() {
        ctx.fillStyle = "#111322";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function drawSnake() {
        snake.forEach((part, index) => {
          ctx.fillStyle = index === 0 ? "#ff007f" : "#00ffcc";
          ctx.shadowBlur = 10;
          ctx.shadowColor = index === 0 ? "#ff007f" : "#00ffcc";
          ctx.fillRect(
            part.x * gridSize,
            part.y * gridSize,
            gridSize - 2,
            gridSize - 2,
          );
        });
      }

      function drawFood() {
        ctx.fillStyle = "#ffe600";
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#ffe600";
        ctx.fillRect(
          food.x * gridSize,
          food.y * gridSize,
          gridSize - 2,
          gridSize - 2,
        );
      }

      function moveSnake() {
        if (dx === 0 && dy === 0) return;

        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score += 10;
          document.getElementById("score").textContent = score;

          // 🚀 DARAJA VA TEZLIKNI OSHIRISH (Har 10 ochkoda)
          updateSpeed();

          generateFood();
        } else {
          snake.pop();
        }
      }

      function updateSpeed() {
        // Har 10 ochko uchun tezlik 15ms ga oshadi (minimal 40ms gacha)
        let level = Math.floor(score / 10);
        gameSpeed = Math.max(40, initialSpeed - level * 15);
      }

      function generateFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
      }

      function checkGameOver() {
        if (dx === 0 && dy === 0) return false;

        const head = snake[0];

        // Devorga urilish
        if (
          head.x < 0 ||
          head.x >= tileCount ||
          head.y < 0 ||
          head.y >= tileCount
        ) {
          return true;
        }

        // O'ziga urilish
        for (let i = 1; i < snake.length; i++) {
          if (head.x === snake[i].x && head.y === snake[i].y) {
            return true;
          }
        }

        return false;
      }

      function changeDirection(event) {
        const key = event.key.toLowerCase();

        if ((key === "arrowleft" || key === "a") && dx === 0) {
          dx = -1;
          dy = 0;
        } else if ((key === "arrowup" || key === "w") && dy === 0) {
          dx = 0;
          dy = -1;
        } else if ((key === "arrowright" || key === "d") && dx === 0) {
          dx = 1;
          dy = 0;
        } else if ((key === "arrowdown" || key === "s") && dy === 0) {
          dx = 0;
          dy = 1;
        }
      }

      function resetGame() {
        clearTimeout(gameTimeout);
        snake = [{ x: 10, y: 10 }];
        dx = 0;
        dy = 0;
        score = 0;
        gameSpeed = initialSpeed; // Tezlikni asl holiga qaytarish
        document.getElementById("score").textContent = score;
        generateFood();
        gameLoop();
      }

      // O'yinni birinchi marta ishga tushirish
      gameLoop();
    </script>
  </body>
</html>
