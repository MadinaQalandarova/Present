<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Interactive Card</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #fff0f3;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
      }
      .card {
        position: relative;
        width: 360px;
        height: 520px;
        background: radial-gradient(circle at center, #ffe4e8 0%, #ffd1dc 100%);
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(255, 105, 180, 0.2);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 30px 20px;
        user-select: none;
      }
      .subtitle {
        font-size: 14px;
        color: #b56576;
        font-style: italic;
      }
      .target-heart {
        width: 70px;
        height: 70px;
        background: #ff4d6d;
        clip-path: path(
          "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
        );
        transform: scale(3);
        filter: drop-shadow(0 10px 15px rgba(255, 77, 109, 0.4));
        animation: pulse 2s infinite ease-in-out;
        margin-top: 20px;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(3);
        }
        50% {
          transform: scale(3.3);
        }
      }
      .interactive-area {
        position: relative;
        width: 100%;
        height: 200px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .btn-shoot {
        padding: 12px 28px;
        background: #ff4d6d;
        color: white;
        border: none;
        border-radius: 50px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 8px 15px rgba(255, 77, 109, 0.3);
        transition: all 0.2s ease;
      }
      .btn-shoot:hover {
        background: #c9184a;
        transform: translateY(-2px);
      }
      .btn-shoot:active {
        transform: translateY(1px);
      }
      .hint {
        margin-top: 10px;
        font-size: 11px;
        letter-spacing: 2px;
        color: #b56576;
        text-transform: uppercase;
      }
      /* Surprise overlay */
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #ff4d6d;
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
        padding: 20px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.8s ease;
      }
      .overlay.active {
        opacity: 1;
        pointer-events: auto;
      }
      .overlay h1 {
        font-size: 38px;
        line-height: 1.1;
        margin-bottom: 10px;
      }
      .overlay p {
        font-size: 14px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="subtitle">a little something, for you</div>

      <div class="target-heart"></div>

      <div class="interactive-area">
        <button class="btn-shoot" id="shootBtn">PULL & RELEASE 🏹</button>
        <div class="hint">Click to send love</div>
      </div>

      <div class="overlay" id="overlay">
        <h1>Happy<br />Birthday!</h1>
        <p>to someone worth celebrating 🎉✨</p>
      </div>
    </div>

    <script>
      const shootBtn = document.getElementById("shootBtn");
      const overlay = document.getElementById("overlay");

      shootBtn.addEventListener("click", () => {
        // Tabriknoma oynasini chiqarish
        overlay.classList.add("active");
      });
    </script>
  </body>
</html>
