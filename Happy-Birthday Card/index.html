<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Birthday Scene</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preload" as="image" href="tree.png" />
  </head>
  <body id="app-body" class="bg-dark">
    <!-- 1-BOSQICH: Yurakcha yog'ilishi va Kamon -->
    <section id="stage-1" class="stage active">
      <div class="subtitle">a little something, for you</div>

      <!-- YURAKLAR BIRLASHADIGAN MAYDON -->
      <div class="heart-assembly-area" id="mainHeart">
        <div id="assemblyContainer"></div>
      </div>

      <!-- KAMON VA O'Q -->
      <div class="bow-wrapper" id="bowWrapper">
        <svg viewBox="0 0 100 100" class="bow-svg">
          <path
            d="M 25,15 Q 70,50 25,85"
            fill="none"
            stroke="#ffffff"
            stroke-width="4"
            stroke-linecap="round"
          />
          <line
            x1="25"
            y1="15"
            x2="25"
            y2="85"
            stroke="#cccccc"
            stroke-width="1.5"
          />
          <g id="arrowGroup">
            <line
              x1="10"
              y1="50"
              x2="60"
              y2="50"
              stroke="#ff4d6d"
              stroke-width="3"
              stroke-linecap="round"
            />
            <polygon points="60,45 72,50 60,55" fill="#ff4d6d" />
          </g>
        </svg>
      </div>

      <div class="instruction">PULL & RELEASE</div>
    </section>

    <!-- 2-BOSQICH: Qizil Fon va Matn (5 sekund) -->
    <section id="stage-2" class="stage">
      <div class="wish-label">make a wish...</div>
      <h1 class="big-title">Happy<br />Birthday</h1>
      <div class="wish-sub">to someone worth celebrating</div>
    </section>

    <!-- 3-BOSQICH: TAYYOR RASMDAGI YURAKLI DARAXT -->
    <section id="stage-3" class="stage tree-stage">
      <div class="tree-image-container">
        <img src="tree.png" alt="Heart Tree" class="tree-img" />
      </div>

      <div class="final-caption">
        <p class="small-text">and... make it count</p>
        <h2>Happy Birthday</h2>
        <p class="small-text">here's to a year that blooms</p>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
