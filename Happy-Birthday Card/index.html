<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Birthday Scene</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="app-body" class="bg-dark">
    <!-- 1-BOSQICH: Kamon va Neon Yurak -->
    <section id="stage-1" class="stage active">
      <div class="subtitle">a little something, for you</div>

      <!-- Qoq markazdagi KATTA YURAK -->
      <div class="heart-container">
        <div class="main-heart" id="mainHeart"></div>
      </div>

      <!-- Pastki chap burchakdagi KAMON -->
      <div class="bow-area" id="bowArea">
        <svg viewBox="0 0 120 120" class="bow-svg">
          <path
            d="M 30,15 Q 80,60 30,105"
            fill="none"
            stroke="#ffffff"
            stroke-width="5"
            stroke-linecap="round"
          />
          <line
            x1="30"
            y1="15"
            x2="30"
            y2="105"
            stroke="#aaaaaa"
            stroke-width="2"
          />
          <g id="arrowGroup">
            <line
              x1="15"
              y1="60"
              x2="80"
              y2="60"
              stroke="#ff4d6d"
              stroke-width="4"
              stroke-linecap="round"
            />
            <polygon points="80,52 95,60 80,68" fill="#ff4d6d" />
          </g>
        </svg>
      </div>

      <div class="instruction">PULL & RELEASE</div>
    </section>

    <!-- 2-BOSQICH: Qizil Fon va Matn -->
    <section id="stage-2" class="stage">
      <div class="wish-label">make a wish...</div>
      <h1 class="big-title">Happy<br />Birthday</h1>
      <div class="wish-sub">to someone worth celebrating</div>
    </section>

    <!-- 3-BOSQICH: Pushti Fon va Yurakli Daraxt -->
    <section id="stage-3" class="stage">
      <div class="tree-wrapper">
        <svg viewBox="0 0 300 350" class="tree-svg">
          <g stroke="#3a1c0d" stroke-linecap="round" fill="none">
            <path d="M 150,330 C 145,240 155,180 150,140" stroke-width="10" />
            <path d="M 150,210 C 130,180 100,160 70,140" stroke-width="6" />
            <path d="M 150,200 C 170,170 200,150 230,135" stroke-width="6" />
            <path d="M 150,160 C 135,130 110,110 95,90" stroke-width="4" />
            <path d="M 150,150 C 165,120 185,100 205,85" stroke-width="4" />
          </g>
          <g id="treeLeaves"></g>
        </svg>
      </div>

      <div class="final-caption">
        <p class="small-text">and... make it count</p>
        <h2>Happy Birthday</h2>
        <p class="small-text">here's to a year that blooms</p>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
