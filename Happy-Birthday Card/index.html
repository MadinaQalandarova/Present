<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Birthday Scene</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="app-body" class="bg-dark">
    <!-- 1-BOSQICH: Kamon va Yurak -->
    <section id="stage-1" class="stage active">
      <div class="subtitle">a little something, for you</div>

      <!-- EKRAN MARKAZIDAGI YURAK -->
      <div class="heart-wrapper">
        <svg viewBox="0 0 100 100" class="main-heart-svg" id="mainHeart">
          <defs>
            <radialGradient id="heartGrad" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#ff8fa3" />
              <stop offset="60%" stop-color="#ff0054" />
              <stop offset="100%" stop-color="#800f2f" />
            </radialGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="coloredBlur" />
              <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <path
            d="M 50,88 C 20,60 5,40 5,25 C 5,12 15,5 27,5 C 36,5 45,10 50,18 C 55,10 64,5 73,5 C 85,5 95,12 95,25 C 95,40 80,60 50,88 Z"
            fill="url(#heartGrad)"
            filter="url(#glow)"
          />
        </svg>
      </div>

      <!-- PASTKI CHAP BURCHAKDAGI KAMON -->
      <div class="bow-wrapper" id="bowWrapper">
        <svg viewBox="0 0 100 100" class="bow-svg">
          <path
            d="M 25,15 Q 70,50 25,85"
            fill="none"
            stroke="#ffffff"
            stroke-width="4"
            stroke-linecap="round"
          />
          <line
            x1="25"
            y1="15"
            x2="25"
            y2="85"
            stroke="#cccccc"
            stroke-width="1.5"
          />
          <g id="arrowGroup">
            <line
              x1="10"
              y1="50"
              x2="60"
              y2="50"
              stroke="#ff4d6d"
              stroke-width="3"
              stroke-linecap="round"
            />
            <polygon points="60,45 72,50 60,55" fill="#ff4d6d" />
          </g>
        </svg>
      </div>

      <div class="instruction">PULL & RELEASE</div>
    </section>

    <!-- 2-BOSQICH: Qizil Fon va Matn (5 sekund) -->
    <section id="stage-2" class="stage">
      <div class="wish-label">make a wish...</div>
      <h1 class="big-title">Happy<br />Birthday</h1>
      <div class="wish-sub">to someone worth celebrating</div>
    </section>

    <!-- 3-BOSQICH: Pushti Fon va Daraxt -->
    <section id="stage-3" class="stage">
      <div class="tree-wrapper">
        <svg viewBox="0 0 300 320" class="tree-svg">
          <g stroke="#3a1c0d" stroke-linecap="round" fill="none">
            <path d="M 150,310 C 145,230 155,170 150,130" stroke-width="8" />
            <path d="M 150,190 C 130,160 100,140 70,125" stroke-width="5" />
            <path d="M 150,180 C 170,150 200,130 230,115" stroke-width="5" />
            <path d="M 150,150 C 135,120 115,100 95,85" stroke-width="3" />
            <path d="M 150,140 C 165,110 185,90 205,75" stroke-width="3" />
          </g>
          <g id="treeLeaves"></g>
        </svg>
      </div>

      <div class="final-caption">
        <p class="small-text">and... make it count</p>
        <h2>Happy Birthday</h2>
        <p class="small-text">here's to a year that blooms</p>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
